<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solar Flare Alert versions</title>
    <link rel="stylesheet" href="lamp.css" />
  </head>
  <body>
    <main>
      <p class="lang"><button type="button" data-lang></button></p>
      <h1 data-i18n="upgradeTitle"></h1>
      <p class="warning" hidden></p>
      <p><button type="button" class="action" id="check" data-i18n="checkLamp"></button></p>
      <div id="releases"></div>

      <div id="wizard" hidden>
        <p class="step-count" data-step-count></p>
        <section data-step="1">
          <p class="lead" data-i18n="upgradeStep1"></p>
          <button type="button" class="action" data-goto="2" data-i18n="upgradeNextPlug"></button>
        </section>
        <section data-step="2" hidden>
          <p class="lead" data-installing></p>
          <p data-i18n="upgradeStep2" data-device-step></p>
          <button type="button" class="action" id="choose" data-i18n="upgradeChoose"></button>
        </section>
        <p class="status" hidden></p>
        <p class="wizard-actions">
          <button type="button" class="action" id="again" hidden data-i18n="upgradeAgain"></button>
          <button type="button" class="action" id="install-latest" hidden data-i18n="install"></button>
          <button type="button" class="text-button" id="back" data-i18n="upgradeBack"></button>
        </p>
        <details>
          <summary data-i18n="serialLog"></summary>
          <pre></pre>
        </details>
      </div>
    </main>
    <script src="lamp.js?v=7"></script>
    <script>
      LampTools.initUpgrade(document);
    </script>
  </body>
</html>
