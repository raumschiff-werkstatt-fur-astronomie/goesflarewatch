name: Lamp site

on:
  push:
    branches:
      - master
    paths:
      - "tools/**"
      - ".github/scripts/pack_lamp_site.py"
      - ".github/workflows/lamp-site.yml"
  pull_request:
    paths:
      - "tools/**"
      - ".github/scripts/pack_lamp_site.py"
      - ".github/workflows/lamp-site.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check the public site
        run: python3 .github/scripts/pack_lamp_site.py tools "$RUNNER_TEMP/lamp-site"

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pack the public site
        run: python3 .github/scripts/pack_lamp_site.py tools _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
