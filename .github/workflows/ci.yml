# Documentation and a lamp release are different.
# A push that only changes docs/ runs these checks and does not publish a new program.
# A lamp release is a directory under tools/versions/ plus one latest entry in
# tools/versions.json. The setup program installs that catalog. The page does not
# open the lamp from the browser.

name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  lamp-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check the release catalog
        run: python3 -m unittest tests/test_pack_lamp_site.py tests/test_lamp_setup.py
